
name: Node.js CI and SAM CLI Cache Test

on:
  push:
    branches: 
      - main
      - feature/redis-cache
      - feature/sam-cache
  pull_request:
    branches: 
    - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Cache SAM CLI
        id: cache-sam
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/bin
            ~/.local/lib/python3.11/site-packages
          key: sam-cli-${{ runner.os }}-v1

      - name: Install SAM CLI
        run: |
          if ! command -v sam &> /dev/null; then
            python3 -m pip install --user aws-sam-cli
          fi

      - name: Check version and time
        run: |
          time sam --version
          echo "Cache hit: ${{ steps.cache-sam.outputs.cache-hit }}"
