
name: Node.js CI with Caching and SAM CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Cache SAM CLI
        id: cache-sam
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/lib/python3.11/site-packages
          key: sam-cli-${{ runner.os }}-v1
          restore-keys: |
            sam-cli-${{ runner.os }}-

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SAM CLI
        run: sam --version
